[global/wm]
include-file = $HOME/.config/polybar/mocha.ini

[bar/top]
fixed-center = true

width = 100%
height = 30pt
radius = 8.9

dpi = 0

background = ${mocha.crust}
foreground = ${mocha.text}

line-size = 3pt

border-size = 2pt
border-color = ${mocha.overlay0}

padding-left = 1
padding-right = 1

module-margin = 1

separator =  
separator-foreground = ${colors.disabled}

dim-value = 0.7

font-0 = JetbrainsMono Nerd Font:size=13
font-1 = MesloLGM Nerd Font:size=13

modules-left = wlan eth memory cpu
modules-center = i3
modules-right = pulseaudio xkeyboard date battery

cursor-click = pointer
cursor-scroll = default 

enable-ipc = true

; i3 workspace navigation
scroll-up = "#i3.prev"
scroll-down = "#i3.next"

; wm-restack = generic
; wm-restack = bspwm

; Changing behavior when in full-screen mode 
; wm-restack = i3
; override-redirect = true

; [module/systray]
; type = internal/tray
;
; format-margin = 8pt
; tray-spacing = 16pt

[module/i3]
type = internal/i3

pin-workspaces = true

show-urgent = true

strip-wsnumbers = false

index-sort = true

enable-click = false
enable-scroll = false

wrapping-scroll = false

reverse-scroll = false

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${mocha.flamingo}

label-focused = %name%
label-focused-foreground = ${mocha.sapphire}
label-focused-background = ${mocha.base}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible= %name%
label-visible-padding = 2

label-urgent= %name%
label-urgent-foreground = ${mocha.crust}
label-urgent-background= ${mocha.peach}
label-urgent-padding = 2

label-separator =   
label-separator-background = ${mocha.crust}
label-separator-padding = 2

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format-prefix = "  "
format-prefix-foreground = ${mocha.blue}

label-layout = %layout%
label-layout-foreground = ${mocha.teal}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2

format-prefix = "  "
format-prefix-foreground = ${mocha.blue}

label = %percentage_used:2%%
label-foreground = ${mocha.yellow}

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = " "
format-prefix-foreground = ${mocha.blue}

label = %percentage:2%%
label-foreground = ${mocha.maroon}

[network-base]
type = internal/network
interval = 5

format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %netspeed% %{F#94e2d5} %{F-} %essid%
label-disconnected = %{F#f38ba8}󰤮 %{F-}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#94e2d5}󰌘 %{F-} %netspeed%
label-disconnected = %{F#f38ba8}󰈂 %{F-} 

connected-icon = 
disconnected-icon = 

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${mocha.mauve}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC

;-- Most batteries never hit 100%
full-at = 98
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%

ramp-capacity-0 =  
ramp-capacity-0-foreground = ${mocha.red}
ramp-capacity-1 =  
ramp-capacity-2 =  
ramp-capacity-3 =  
ramp-capacity-4 =  
ramp-capacity-foreground = ${mocha.yellow}

animation-charging-0 =  
animation-charging-1 =  
animation-charging-2 =  
animation-charging-3 =  
animation-charging-4 =  
animation-charging-foreground = ${mocha.green}
animation-charging-framerate = 750
